name: Knot Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'knot-core/**'
      - 'knot-cli/**'
      - 'examples/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'knot-core/**'
      - 'knot-cli/**'
      - 'examples/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: knot-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Kotlin modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - run: ./gradlew check :knot-cli:test :examples:idempotency-demo:run --no-daemon --console=plain
      - name: Verify generated Android and Ktor template
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :knot-cli:run --args="init --dir $RUNNER_TEMP" --no-daemon --console=plain
          cd "$RUNNER_TEMP/knot-app"
          ./gradlew check :androidApp:assembleDebug --no-daemon --console=plain